# 在 GitHub 上构建 Android 包 —— 本地不用装 Android Studio。
#
# 怎么用: GitHub 仓库页 → Actions → "Android" → Run workflow
#
#   • 默认出 debug APK:可以直接发给人装到手机上试(不用上架)
#   • 想出上架用的 AAB,去 Settings → Secrets and variables → Actions 加 4 个 secret:
#       ANDROID_KEYSTORE_BASE64   —— keystore 文件的 base64(见 README)
#       ANDROID_KEYSTORE_PASSWORD
#       ANDROID_KEY_ALIAS
#       ANDROID_KEY_PASSWORD
#     加了之后 release 这个 job 才会跑。
#   • 要推送,再加一个 secret(内容就是 Firebase 下载的那个文件的全文):
#       ANDROID_GOOGLE_SERVICES_JSON
#     没加也能正常出包,只是推送收不到。这个文件带密钥,所以不进 git。
#   • 想让每次出的 debug APK 能直接覆盖安装(不用先卸载),加一个 secret:
#       ANDROID_DEBUG_KEYSTORE_BASE64   —— debug keystore 的 base64(见 README)
#     没加就是每次随机签名,照样能出包。
name: Android

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本号 (例如 1.0.3)'
        required: false
        default: '1.0.0'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  debug-apk:
    name: Debug APK (可直接安装)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 装依赖
        run: npm ci

      - name: 还原 google-services.json (没配就跳过)
        env:
          GS_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then
            printf '%s' "$GS_JSON" > android/app/google-services.json
            node -e "JSON.parse(require('fs').readFileSync('android/app/google-services.json','utf8'))"
            echo "google-services.json 已写入并通过 JSON 解析"
          else
            echo "::notice::没有配 ANDROID_GOOGLE_SERVICES_JSON,跳过 —— 推送收不到,其他功能不受影响"
          fi

      - name: 套用 app.config.json + 同步到原生项目
        run: npm run sync:android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          # 不要装 'tools' —— 这个包是旧版 Android SDK Tools,Google 仓库里已经移除,
          # sdkmanager 会报 Failed to find package 'tools' 然后 exit 1(这是 action 的默认值)。
          # runner 镜像自带 Android SDK,这一步只需要接受 license 和设好 ANDROID_HOME。
          packages: ''

      # 调试包默认用 Gradle 的 ~/.android/debug.keystore,runner 每次都是新机器,
      # 就每次随机生成一把 —— 新包和旧包签名不同,装的时候报
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE,只能先卸载(会清掉 app 数据)。
      # 配了这个 secret 就用同一把,新包可以直接覆盖安装。
      # 它只签调试包,和上架用的 release keystore 无关。
      - name: 还原固定的 debug keystore (没配就用随机的)
        env:
          DEBUG_KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KS" ]; then
            mkdir -p ~/.android
            printf '%s' "$DEBUG_KS" | base64 -d > ~/.android/debug.keystore
            # Gradle 的默认值:密码 android,别名 androiddebugkey。不对就早点失败
            keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
              | grep -E 'SHA256:' | sed 's/^\s*/固定 debug 签名 /'
          else
            echo "::notice::没有配 ANDROID_DEBUG_KEYSTORE_BASE64,用随机生成的 debug 签名 —— 新包不能覆盖安装旧包,得先卸载"
          fi

      - name: Gradle 构建
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  release-aab:
    name: Release AAB (上架 Google Play)
    runs-on: ubuntu-latest
    # 没配 keystore secret 就跳过这个 job,不会报错
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: 检查有没有配 keystore
        id: check
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::notice::没有配 ANDROID_KEYSTORE_BASE64,跳过 release 构建。只要 debug APK 的话这是正常的。"
          else
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.has_keystore == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: 装依赖
        if: steps.check.outputs.has_keystore == 'true'
        run: npm ci

      - name: 还原 google-services.json (没配就跳过)
        if: steps.check.outputs.has_keystore == 'true'
        env:
          GS_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then
            printf '%s' "$GS_JSON" > android/app/google-services.json
            node -e "JSON.parse(require('fs').readFileSync('android/app/google-services.json','utf8'))"
            echo "google-services.json 已写入并通过 JSON 解析"
          else
            echo "::notice::没有配 ANDROID_GOOGLE_SERVICES_JSON,跳过 —— 推送收不到,其他功能不受影响"
          fi

      - name: 套用 app.config.json + 同步到原生项目
        if: steps.check.outputs.has_keystore == 'true'
        run: npm run sync:android

      - uses: actions/setup-java@v4
        if: steps.check.outputs.has_keystore == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3
        if: steps.check.outputs.has_keystore == 'true'
        with:
          # 不要装 'tools' —— 这个包是旧版 Android SDK Tools,Google 仓库里已经移除,
          # sdkmanager 会报 Failed to find package 'tools' 然后 exit 1(这是 action 的默认值)。
          # runner 镜像自带 Android SDK,这一步只需要接受 license 和设好 ANDROID_HOME。
          packages: ''

      - name: 还原 keystore
        if: steps.check.outputs.has_keystore == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # 确认文件是个合法 keystore,早点失败好排查
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > /dev/null
          echo "keystore OK"

      - name: Gradle 构建 (签名 AAB)
        if: steps.check.outputs.has_keystore == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: 上传 AAB
        if: steps.check.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 90

      - name: 清掉 keystore
        if: always() && steps.check.outputs.has_keystore == 'true'
        run: rm -f "$RUNNER_TEMP/release.keystore"
